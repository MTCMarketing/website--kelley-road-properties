:root {
  --kr-background: #FFFFFF;
  --kr-background-alt: #F1F2F4;
  --kr-primary: #1F2328;
  --kr-primary-dark: #15181C;

  --kr-font-heading: &quot;Manrope&quot;, &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
  --kr-font-body: &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif;
}

.kr-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 15px 30px;
  border: 1px solid transparent;
  border-radius: 2px;
  font-family: &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif;
  font-size: 12.5px;

  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition:
    background-color .26s cubic-bezier(.4, 0, .2, 1),
    border-color .26s cubic-bezier(.4, 0, .2, 1),
    color .26s cubic-bezier(.4, 0, .2, 1),
    transform .16s cubic-bezier(.4, 0, .2, 1);
}
.kr-btn:active { transform: translateY(1px); }
.kr-btn:focus-visible {
  outline: 2px solid #C89F5B;
  outline-offset: 3px;
}

/* ── primary dark ── */
.kr-btn--dark {
  background: #1F2328;
  border-color: #1F2328;
  color: #FFFFFF;
}
.kr-btn--dark:hover {
  background: #C89F5B;
  border-color: #C89F5B;
  color: #FFFFFF;
}

/* ── gold CTA ── */
.kr-btn--gold {
  background: #C89F5B;
  border-color: #C89F5B;

  background: #B08D4C;
  border-color: #B08D4C;

.kr-btn--outline {
  background: transparent;

}

  background: #C89F5B;
  border-color: #C89F5B;

.kr-btn--sm {

.kr-sectitle {
  --kr-ghost-size: clamp(64px, 12.5vw, 220px);
  /*
   * The ghost is one long unbreakable word, so its size has to answer to how
   * many characters it has: &quot;WHY US&quot; and &quot;HOW IT WORKS&quot; cannot share a font
   * size and both fit. --kr-ghost-chars is set per instance by the component,
   * and --kr-ghost-fit takes whichever is smaller: the designed size, or the
   * size at which the word still spans the container.
   *
   * cqi needs this element to be a query container; descendants read it.
   */
  container-type: inline-size;
  --kr-ghost-fit: min(
    var(--kr-ghost-size),
    calc(100cqi / (var(--kr-ghost-chars, 8) * 0.62))
  );
  position: relative;
  /* Predictable local stacking context — see note 1. */
  isolation: isolate;
  padding-bottom: 48px;
  /* Belt and braces: the fit calc should prevent overflow, but a font that
     loads wider than estimated must still never widen the page. */
  overflow: hidden;
}
/* Top padding lives on the content, not the root: it is derived from the same
   fit value, and only a descendant of the container can read cqi. */
.kr-sectitle__content { padding-top: calc(var(--kr-ghost-fit) * 0.42); }

/* Without container queries, fall back to the designed size and the old
   fixed padding — the word may crop, but nothing breaks. */
@supports not (container-type: inline-size) {
  .kr-sectitle__content { padding-top: calc(var(--kr-ghost-size) * 0.42); }
}
@supports (overflow: clip) {
  /* clip does not create a scroll container, unlike hidden. */
  .kr-sectitle { overflow: clip; }
}

/* ── ghost word ───────────────────────────────────────── */
.kr-sectitle__ghost-wrap {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 0;
  display: flex;
  pointer-events: none;
  user-select: none;
}

.kr-sectitle__ghost {
  margin: 0 -0.045em;
  font-family: &quot;Manrope&quot;, &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
  font-size: var(--kr-ghost-fit, var(--kr-ghost-size));
  font-weight: 800;
  line-height: 0.8;
  letter-spacing: -0.02em;
  text-transform: uppercase;

  opacity: 0.75;
  transform: none;
}

/* ── content ──────────────────────────────────────────── */
.kr-sectitle__content {
  position: relative;
  z-index: 1;
}

.kr-sectitle__title {
  margin: 0;
  max-width: 20ch;
  color: #1F2328;
  font-family: &quot;Manrope&quot;, &quot;Inter&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
  font-size: clamp(28px, 3.6vw, 46px);
